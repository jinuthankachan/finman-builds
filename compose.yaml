# finman in Docker: the app, PostgreSQL (your records) and Redis (sign-ins and status). All
# three keep their data in named volumes, so stopping and starting again loses nothing.
#
#   docker compose up -d --wait                         start; then open http://127.0.0.1:8790
#   docker compose pull && docker compose up -d --wait  update to the newest release
#   docker compose logs -f app                          watch the app's log
#   docker compose down                                 stop; the data stays
#   docker compose down -v                              stop and DELETE ALL YOUR DATA
#
# Settings (passwords, the port, API keys, a fixed version) go in a file named .env next to this
# one: see .env.example. The defaults work as they are.
#
# The image has no AI command-line tools (claude, codex, agy): in Docker the advisor uses the
# API services, with keys typed on the Settings page or set in .env.
name: finman

services:
  app:
    image: ghcr.io/jinuthankachan/finman:${FINMAN_VERSION:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-invest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invest}
      POSTGRES_DB: ${POSTGRES_DB:-invest}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # API keys: optional; keys typed on the Settings page win.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # API addresses: optional; addresses saved under Settings > AI access win.
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GOOGLE_GEMINI_BASE_URL: ${GOOGLE_GEMINI_BASE_URL:-}
    # A server on this computer (a local model, a proxy) is http://host.docker.internal:PORT
    # from the app; 127.0.0.1 there is the container itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8790}:8790"
    volumes:
      - appdata:/data
    # A stop lets running requests finish (10 s) and the job worker wind down (20 s).
    stop_grace_period: 40s

  # PostgreSQL and Redis are reachable from the app only, not from this computer's network:
  # docker compose exec db psql -U invest invest, docker compose exec redis redis-cli.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invest}
      POSTGRES_DB: ${POSTGRES_DB:-invest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invest} -d ${POSTGRES_DB:-invest}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  # The app's data folder (/data): config.toml, secrets.toml, uploaded statements, jobs, cache.
  appdata:
  # Your records.
  pgdata:
  # Sign-ins and status.
  redisdata:
